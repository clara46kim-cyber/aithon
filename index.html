<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="기분과 MBTI를 바탕으로 AI가 오늘의 음식 메뉴를 추천합니다." />
  <title>오늘 뭐 먹지? | AI 메뉴 추천</title>
  <style>
    :root {
      --bg: #fff8f1;
      --card: rgba(255, 255, 255, 0.88);
      --text: #25211f;
      --muted: #746b66;
      --primary: #ff6b4a;
      --primary-dark: #e84f31;
      --line: #f0ded3;
      --shadow: 0 20px 60px rgba(86, 47, 29, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 185, 151, 0.45), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(255, 221, 139, 0.4), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(720px, 100%);
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(34px, 7vw, 56px);
      letter-spacing: -0.06em;
      line-height: 1.08;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: clamp(22px, 5vw, 38px);
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 800;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffdfa;
      color: var(--text);
      border-radius: 16px;
      padding: 15px 16px;
      font: inherit;
      outline: none;
      transition: .2s ease;
    }

    textarea {
      min-height: 128px;
      resize: vertical;
      line-height: 1.6;
    }

    select { height: 54px; }

    textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 107, 74, .12);
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 0;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 12px;
    }

    .chip:hover { border-color: var(--primary); color: var(--primary-dark); }

    .submit {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 17px;
      padding: 17px 20px;
      background: linear-gradient(135deg, var(--primary), #ff8b4a);
      color: white;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 107, 74, .23);
      transition: transform .2s ease, opacity .2s ease;
    }

    .submit:hover { transform: translateY(-1px); }
    .submit:disabled { opacity: .6; cursor: wait; transform: none; }

    .result {
      display: none;
      margin-top: 20px;
      padding: 22px;
      border-radius: 20px;
      background: #fffaf5;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      line-height: 1.75;
    }

    .result.show { display: block; animation: rise .35s ease both; }
    .result.error { color: #a52a1d; background: #fff2ef; }

    .result-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 900;
    }

    .hint {
      margin: 18px 0 0;
      text-align: center;
      color: #91847c;
      font-size: 12px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 620px) {
      body { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .card { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <span class="badge">✨ Gemini AI 메뉴 큐레이터</span>
      <h1>오늘 뭐 먹지?</h1>
      <p class="subtitle">지금 기분과 MBTI를 알려주면<br />당신에게 어울리는 메뉴를 추천해 드려요.</p>
    </section>

    <section class="card">
      <form id="recommendForm">
        <div class="grid">
          <div>
            <label for="mood">지금 기분은 어떤가요?</label>
            <textarea id="mood" name="mood" maxlength="300" required placeholder="예: 오늘 일이 많아서 지쳤지만, 맛있는 음식을 먹으며 위로받고 싶어요."></textarea>
            <div class="examples" aria-label="기분 예시">
              <button class="chip" type="button" data-mood="기분이 울적해서 따뜻한 위로가 필요해요.">울적해요</button>
              <button class="chip" type="button" data-mood="신나고 에너지가 넘쳐서 특별한 음식을 먹고 싶어요.">신나요</button>
              <button class="chip" type="button" data-mood="많이 지쳐서 간편하지만 든든한 음식이 필요해요.">지쳤어요</button>
            </div>
          </div>

          <div>
            <label for="mbti">나의 MBTI</label>
            <select id="mbti" name="mbti" required>
              <option value="">선택하기</option>
              <option>ISTJ</option><option>ISFJ</option><option>INFJ</option><option>INTJ</option>
              <option>ISTP</option><option>ISFP</option><option>INFP</option><option>INTP</option>
              <option>ESTP</option><option>ESFP</option><option>ENFP</option><option>ENTP</option>
              <option>ESTJ</option><option>ESFJ</option><option>ENFJ</option><option>ENTJ</option>
            </select>
          </div>
        </div>

        <button class="submit" id="submitButton" type="submit">🍽️ 오늘의 메뉴 추천받기</button>
      </form>

      <div id="result" class="result" aria-live="polite"></div>
      <p class="hint">MBTI는 재미 요소로만 활용되며, 추천 결과는 참고용입니다.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('recommendForm');
    const moodInput = document.getElementById('mood');
    const submitButton = document.getElementById('submitButton');
    const result = document.getElementById('result');

    document.querySelectorAll('[data-mood]').forEach((button) => {
      button.addEventListener('click', () => {
        moodInput.value = button.dataset.mood;
        moodInput.focus();
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const mood = moodInput.value.trim();
      const mbti = document.getElementById('mbti').value;
      if (!mood || !mbti) return;

      submitButton.disabled = true;
      submitButton.textContent = 'AI가 메뉴를 고민하고 있어요...';
      result.className = 'result show';
      result.innerHTML = '<div class="result-title">🤔 잠시만요</div>기분과 성향을 살펴보고 가장 어울리는 메뉴를 찾는 중입니다.';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mood, mbti })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '추천을 불러오지 못했습니다.');

        result.className = 'result show';
        result.innerHTML = '<div class="result-title">🎉 AI 추천 결과</div>' + escapeHtml(data.recommendation);
      } catch (error) {
        result.className = 'result show error';
        result.innerHTML = '<div class="result-title">⚠️ 오류가 발생했어요</div>' + escapeHtml(error.message);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = '🍽️ 오늘의 메뉴 다시 추천받기';
      }
    });

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
        .replaceAll('\n', '<br>');
    }
  </script>
</body>
</html>
